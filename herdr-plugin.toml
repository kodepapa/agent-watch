# herdr plugin: see what every agent is doing without leaving herdr.
#   herdr plugin install kodepapa/agent-watch
# Needs the `agentwatch` command on PATH (uv tool install, or brew).
id = "kodepapa.agentwatch"
name = "agentwatch"
version = "0.2.0"
min_herdr_version = "0.9.0"
description = "Every agent at a glance: state, time in state, current action, activity timeline, who needs you"
platforms = ["linux", "macos"]

# Compact view: one row per herdr agent with an activity strip, plus the timeline.
[[panes]]
id = "glance"
title = "agents"
placement = "split"
command = ["agentwatch", "--glance"]

# Full dashboard: tasks, advisor calls, timeline, log, tokens.
[[panes]]
id = "dashboard"
title = "agentwatch"
placement = "tab"
command = ["agentwatch", "--dashboard", "--no-sessions"]

[[actions]]
id = "side"
title = "agentwatch: agents beside this pane"
contexts = ["global"]
command = ["agentwatch", "herdr", "open", "--view", "glance", "--placement", "split"]

[[actions]]
id = "popup"
title = "agentwatch: agents popup (press a number to jump)"
contexts = ["global"]
command = ["agentwatch", "herdr", "open", "--view", "glance", "--placement", "popup"]

[[actions]]
id = "open"
title = "agentwatch: full dashboard in a tab"
contexts = ["global"]
command = ["agentwatch", "herdr", "open", "--view", "dashboard", "--placement", "tab"]
